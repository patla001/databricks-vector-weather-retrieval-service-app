command:
  - "python"
  - "app.py"

env:
  # --- Credentials, injected by the Databricks platform -----------------------
  # `valueFrom` names an APP RESOURCE, not a secret scope. Add it on the app's
  # page under Resources:
  #
  #   | resource key         | scope    | key                  | permission |
  #   |----------------------|----------|----------------------|------------|
  #   | weather-lakebase-url | database | weather-lakebase-url | READ       |
  #
  # Without the resource the variable resolves to an empty string and the app
  # falls through to the SDK path below.
  - name: LAKEBASE_URL
    valueFrom: weather-lakebase-url

  # --- Fallback: read the secret through the SDK ------------------------------
  # Used only when LAKEBASE_URL is unset/empty. Requires the app's service
  # principal to have READ on the scope.
  #
  # This app deliberately uses its OWN key rather than the shared
  # `database/lakebase-url` that the day-2 ticker-news app reads. Sharing one key
  # would mean repointing that app every time this one changes databases.
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "weather-lakebase-url"

  # --- Non-secret configuration ----------------------------------------------
  # The NWS API needs no key, but it does require a User-Agent identifying the
  # caller. Replace the address with your own before deploying.
  - name: NWS_USER_AGENT
    value: "(databricks-vector-weather-retrieval-service-app, epatlan1742@sdsu.edu)"
  - name: NWS_API_BASE_URL
    value: "https://api.weather.gov"
  - name: WEATHER_ALERT_SCOPE
    value: "state"
  # Pipe-separated: each entry is itself "City, ST", so a comma-delimited list
  # would split every location in half.
  - name: WEATHER_LOCATIONS
    value: "Chicago, IL|Austin, TX|Houston, TX|Miami, FL|Denver, CO"

  - name: WEATHER_DOCUMENTS_TABLE
    value: "weather_documents"
  - name: WEATHER_EMBEDDINGS_TABLE
    value: "weather_embeddings"
  - name: WEATHER_EMBED_MODEL
    value: "sentence-transformers/all-MiniLM-L6-v2"

  # fastembed writes its ONNX download here. Databricks Apps only guarantee /tmp
  # is writable, so this must not point anywhere else.
  - name: FASTEMBED_CACHE_PATH
    value: "/tmp/.cache/fastembed"

  # --- In-app refresh scheduler ----------------------------------------------
  # Active NWS alerts expire within hours, so the corpus needs re-harvesting on
  # a timer. This runs inside the app process rather than as a Databricks Job:
  # the workspace is serverless-only, and a serverless job task that loads
  # requests + psycopg2 + fastembed together segfaults its kernel (see
  # DEPLOY.md). The app already runs that exact combination to serve
  # /weather/search, so it is the runtime that provably works.
  # Set WEATHER_REFRESH_MINUTES to 0 to turn the timer off.
  - name: WEATHER_REFRESH_MINUTES
    value: "30"
  - name: WEATHER_REFRESH_STARTUP_DELAY
    value: "60"
  - name: WEATHER_REFRESH_LIMIT
    value: "50"
  - name: WEATHER_PURGE_EXPIRED_DAYS
    value: "7"

  # --- Optional: the RAG summary ----------------------------------------------
  # GET /weather/search?summarize=true asks Claude for a paragraph grounded in
  # the retrieved passages, which the console renders above the ranked list.
  # Leave this off and search still works - the console shows "Summary
  # unavailable" and the results are unaffected.
  #
  # To turn it on, store the key and attach it as an app resource, then
  # uncomment the two lines below and redeploy:
  #
  #   databricks secrets put-secret database anthropic-api-key
  #   databricks apps update weather-vector-app --json '{
  #     "name": "weather-vector-app",
  #     "resources": [
  #       {"name": "weather-lakebase-url",
  #        "secret": {"scope": "database", "key": "weather-lakebase-url", "permission": "READ"}},
  #       {"name": "anthropic-api-key",
  #        "secret": {"scope": "database", "key": "anthropic-api-key", "permission": "READ"}}
  #     ]}'
  #
  # Kept commented rather than pointing at a resource that may not exist: an
  # unresolvable valueFrom is a deploy-time problem, and the summary is an
  # extra that must never be able to take the API down.
  # - name: ANTHROPIC_API_KEY
  #   valueFrom: anthropic-api-key

  # --- Summary guardrails -----------------------------------------------------
  # The summary is the only per-request cost in this app. These bound it; each
  # one degrades to search-only rather than failing the request.
  #
  # Set a spend limit on the Anthropic Console as well. A ceiling enforced
  # inside the process cannot help when the process itself is the problem.
  - name: WEATHER_SUMMARY_DAILY_LIMIT
    value: "200"
  - name: WEATHER_SUMMARY_TIMEOUT
    value: "60"
  - name: WEATHER_SUMMARY_CACHE_SIZE
    value: "256"
  - name: WEATHER_SUMMARY_CACHE_TTL
    value: "3600"

  - name: FLASK_DEBUG
    value: "0"
