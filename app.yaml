command:
  - "python"
  - "app.py"

env:
  # --- Credentials, injected by the Databricks platform -----------------------
  # `valueFrom` names an APP RESOURCE, not a secret scope. Add it on the app's
  # page under Resources:
  #
  #   | resource key | scope    | key          | permission |
  #   |--------------|----------|--------------|------------|
  #   | lakebase-url | database | lakebase-url | READ       |
  #
  # Without the resource the variable resolves to an empty string and the app
  # falls through to the SDK path below.
  - name: LAKEBASE_URL
    valueFrom: lakebase-url

  # --- Fallback: read the secret through the SDK ------------------------------
  # Used only when LAKEBASE_URL is unset/empty. Requires the app's service
  # principal to have READ on the scope.
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

  # --- Non-secret configuration ----------------------------------------------
  # The NWS API needs no key, but it does require a User-Agent identifying the
  # caller. Replace the address with your own before deploying.
  - name: NWS_USER_AGENT
    value: "(databricks-vector-weather-retrieval-service-app, epatlan1742@sdsu.edu)"
  - name: NWS_API_BASE_URL
    value: "https://api.weather.gov"
  - name: WEATHER_ALERT_SCOPE
    value: "state"
  # Pipe-separated: each entry is itself "City, ST", so a comma-delimited list
  # would split every location in half.
  - name: WEATHER_LOCATIONS
    value: "Chicago, IL|Austin, TX|Houston, TX|Miami, FL|Denver, CO"

  - name: WEATHER_DOCUMENTS_TABLE
    value: "weather_documents"
  - name: WEATHER_EMBEDDINGS_TABLE
    value: "weather_embeddings"
  - name: WEATHER_EMBED_MODEL
    value: "sentence-transformers/all-MiniLM-L6-v2"

  # fastembed writes its ONNX download here. Databricks Apps only guarantee /tmp
  # is writable, so this must not point anywhere else.
  - name: FASTEMBED_CACHE_PATH
    value: "/tmp/.cache/fastembed"

  - name: FLASK_DEBUG
    value: "0"
